services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    env_file: 
      - .env
    networks:
      - inception
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - wordpress:/var/www/html/wordpress
    depends_on:
      wordpress:
        condition: service_healthy

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    env_file:
      - .env
    networks:
      - inception
    restart: always
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$DB_ROOT_PASS"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    env_file:
      - .env
    networks:
      - inception
    restart: always
    volumes:
      - wordpress:/var/www/html/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pidof", "php-fpm83"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

networks:
  inception:
    name: inception

volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb 

  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress  
